<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="card head">
      <h1>QuickLogin · 多账号并行</h1>
    </header>

    <section class="card control">
      <button id="open-parallel" class="btn-primary launch">打开并行管理页</button>
      <button id="open-wheel" class="btn-ghost launch">账号选择轮盘（Alt+Q）</button>
      <button id="grant-site" class="btn-ghost launch">授权当前站点</button>
      <p class="hint" id="grant-hint">在目标站点标签页上点击「授权当前站点」，该站点的请求头改写才会生效。</p>
    </section>

    <p class="hint" id="ext-version"></p>

    <script src="popup.js"></script>
  </body>
</html>
