<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../theme.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="wrap">
      <h1>SessionBox · 设置</h1>

      <section class="card block">
        <h2>站点与授权</h2>
        <p class="desc">把目标站点添加进来并授予权限后，即可在该站点创建账号会话。也可用快捷键 <code>Ctrl+Shift+E</code> 或右键菜单快速添加当前站点。</p>
        <form id="site-form" class="row">
          <input id="site-host" placeholder="例如 example.com" autocomplete="off" />
          <button class="btn-primary" type="submit">授权添加</button>
        </form>
        <ul id="site-list" class="plain"></ul>
      </section>

      <section class="card block">
        <h2>会话管理</h2>
        <ul id="session-list" class="plain"></ul>
      </section>
    </main>

    <script src="options.js"></script>
  </body>
</html>
